# The aho-corasick guide, served at baskingspot.dev/aho-corasick/. The theme
# and the site build come from baskingspot-docs; the router in baskingspot/site
# serves /aho-corasick/...
base_url = "https://baskingspot.dev/aho-corasick"
theme = "baskingspot"
title = "aho-corasick"
description = "Aho-Corasick multi-pattern search in Zig, with the automaton built at comptime."

generate_feeds = false
build_search_index = false

[markdown]
insert_anchor_links = "heading"

[markdown.highlighting]
# An unknown fence language is a build error, not an unhighlighted block.
error_on_missing_language = true
light_theme = "github-light"
dark_theme = "github-dark"

[extra]
repo = "baskingspot/aho-corasick"
api = true
third_party = true
